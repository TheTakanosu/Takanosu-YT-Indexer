loop-playlist=inf
# [Dont Touch]
hwdec=auto-safe
hidpi-window-scale=no
profile=gpu-hq
gpu-api=d3d11
cache=yes

# [Video's Cache]
demuxer-max-bytes=75M
demuxer-max-back-bytes=75M
demuxer-readahead-secs=60

# [Your Cookies]
# Handled by scripts/cookies.lua, which resolves the path at runtime so this
# folder works wherever you put it. Drop your own cookies.txt next to this
# file and it is picked up automatically; with no cookies.txt it is skipped.
#
# Do NOT hardcode it here: ytdl-raw-options is passed to yt-dlp as literal
# text, so an absolute path from another machine silently breaks playback, and
# pointing at a cookies.txt that does not exist makes yt-dlp fail outright.
#
# ytdl-raw-options=cookies=C:/mpv/cookies.txt,js-runtimes=node

# [Video Quality]
ytdl-format=bestvideo[height<=1080]+bestaudio/best

# [Volume Settings] / (Type between: 0-130)-(Default is:100)
volume=50
